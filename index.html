<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Olvid</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at 50% 40%, #1a1a2e 0%, #0a0a15 60%, #000000 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            position: relative;
        }

        /* ذرات نورانی پس‌زمینه */
        body::before,
        body::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            pointer-events: none;
            animation: floatBg 8s ease-in-out infinite;
        }

        body::before {
            width: 300px;
            height: 300px;
            background: #667eea;
            top: -100px;
            left: -100px;
        }

        body::after {
            width: 350px;
            height: 350px;
            background: #764ba2;
            bottom: -120px;
            right: -120px;
            animation-delay: -4s;
        }

        @keyframes floatBg {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(30px, -30px) scale(1.15); }
        }

        /* کانتینر اصلی اثر انگشت */
        .fingerprint-container {
            position: relative;
            /* اندازه‌ی واکنش‌گرا: ۷۵٪ کوچک‌ترین بُعد صفحه، حداکثر ۴۲۰ پیکسل */
            width: 75vmin;
            height: 75vmin;
            max-width: 420px;
            max-height: 420px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 10;
            transition: transform 0.2s ease;
        }

        .fingerprint-container:active {
            transform: scale(0.94);
        }

        /* حلقه‌های نورانی چرخان */
        .ring {
            position: absolute;
            border-radius: 50%;
            border: 2px solid transparent;
            pointer-events: none;
        }

        .ring-1 {
            width: 100%;
            height: 100%;
            border-top-color: #667eea;
            border-right-color: #667eea;
            animation: spin 3s linear infinite;
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.6);
        }

        .ring-2 {
            width: 84%;
            height: 84%;
            border-bottom-color: #764ba2;
            border-left-color: #764ba2;
            animation: spin 4s linear infinite reverse;
            box-shadow: 0 0 15px rgba(118, 75, 162, 0.5);
        }

        .ring-3 {
            width: 68%;
            height: 68%;
            border-top-color: #a78bfa;
            border-left-color: #a78bfa;
            animation: spin 2.5s linear infinite;
            opacity: 0.7;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* هاله‌ی نورانی پشت اثر انگشت */
        .glow {
            position: absolute;
            width: 60%;
            height: 60%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(102, 126, 234, 0.8) 0%, rgba(102, 126, 234, 0) 70%);
            animation: pulse 2s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.25); opacity: 1; }
        }

        /* تصویر اثر انگشت */
        .fingerprint-img {
            width: 55%;
            height: 55%;
            object-fit: contain;
            z-index: 5;
            filter: drop-shadow(0 0 15px rgba(102, 126, 234, 0.9));
            transition: all 0.3s ease;
            pointer-events: none;
        }

        /* حالت فعال (هنگام لمس) */
        .fingerprint-container.active .fingerprint-img {
            filter: drop-shadow(0 0 30px rgba(56, 239, 125, 1));
            transform: scale(1.08);
        }

        .fingerprint-container.active .glow {
            background: radial-gradient(circle, rgba(56, 239, 125, 0.9) 0%, rgba(56, 239, 125, 0) 70%);
        }

        .fingerprint-container.active .ring-1 {
            border-top-color: #38ef7d;
            border-right-color: #38ef7d;
            box-shadow: 0 0 25px rgba(56, 239, 125, 0.8);
        }

        .fingerprint-container.active .ring-2 {
            border-bottom-color: #11998e;
            border-left-color: #11998e;
        }

        .fingerprint-container.active .ring-3 {
            border-top-color: #38ef7d;
            border-left-color: #38ef7d;
        }

        /* موج انفجاری هنگام کلیک */
        .ripple {
            position: absolute;
            width: 60%;
            height: 60%;
            border-radius: 50%;
            border: 2px solid #38ef7d;
            opacity: 0;
            pointer-events: none;
        }

        .ripple.go {
            animation: rippleOut 0.8s ease-out forwards;
        }

        @keyframes rippleOut {
            0% {
                transform: scale(0.8);
                opacity: 0.8;
            }
            100% {
                transform: scale(2.5);
                opacity: 0;
            }
        }

        /* انیمیشن تیک موفقیت */
        .checkmark {
            position: absolute;
            width: 45%;
            height: 45%;
            z-index: 20;
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            pointer-events: none;
        }

        .checkmark.show {
            opacity: 1;
            transform: scale(1);
        }

        .checkmark svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 15px rgba(56, 239, 125, 1));
        }

        .checkmark svg path {
            stroke: #38ef7d;
            stroke-width: 4;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 60;
            stroke-dashoffset: 60;
        }

        .checkmark.show svg path {
            animation: drawCheck 0.4s ease forwards 0.1s;
        }

        @keyframes drawCheck {
            to { stroke-dashoffset: 0; }
        }
    </style>
</head>
<body>

    <!-- کانتینر اثر انگشت -->
    <div class="fingerprint-container" id="fingerprint">
        <div class="ripple" id="ripple"></div>
        <div class="ring ring-1"></div>
        <div class="ring ring-2"></div>
        <div class="ring ring-3"></div>
        <div class="glow"></div>

        <!-- تصویر اثر انگشت شما -->
        <img
            class="fingerprint-img"
            src="https://uploadkon.ir/uploads/53d222_26finger.png"
            alt="fingerprint"
            draggable="false"
        >

        <!-- تیک موفقیت -->
        <div class="checkmark" id="checkmark">
            <svg viewBox="0 0 64 64">
                <path d="M 16 32 L 28 44 L 48 20"/>
            </svg>
        </div>
    </div>

    <script>
        const INVITE_LINK = "https://invitation.olvid.io/#AwAAAGcAAAAAWmh0dHBzOi8vc2VydmVyLm9sdmlkLmlvAABNr94IZ8tUMHhxNT3IuzaP0StqaeJXvjOzPDepCMrpWQEwmx1FkTSurZQBo0_mPVtHKeYAC5HCkP8sUXRIMEZrAgAAAAADbWhh";

        let isProcessing = false;

        // کپی در کلیپ‌بورد
        async function copyToClipboard(text) {
            try {
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(text);
                    return true;
                } else {
                    const textArea = document.createElement('textarea');
                    textArea.value = text;
                    textArea.style.position = 'fixed';
                    textArea.style.left = '-999999px';
                    textArea.style.top = '-999999px';
                    document.body.appendChild(textArea);
                    textArea.focus();
                    textArea.select();
                    const successful = document.execCommand('copy');
                    document.body.removeChild(textArea);
                    return successful;
                }
            } catch (err) {
                console.error('Copy error:', err);
                return false;
            }
        }

        // لرزش کوتاه (اگر پشتیبانی شود)
        function vibrate(pattern) {
            if (navigator.vibrate) {
                navigator.vibrate(pattern);
            }
        }

        // عمل اصلی
        async function handleTouch() {
            if (isProcessing) return;
            isProcessing = true;

            const container = document.getElementById('fingerprint');
            const ripple = document.getElementById('ripple');
            const checkmark = document.getElementById('checkmark');

            // 1. افکت بصری: حالت فعال
            container.classList.add('active');
            vibrate([30, 30, 60]);

            // 2. موج انفجاری
            ripple.classList.remove('go');
            void ripple.offsetWidth; // ریست انیمیشن
            ripple.classList.add('go');

            // 3. کپی لینک
            await copyToClipboard(INVITE_LINK);

            // 4. نمایش تیک موفقیت
            setTimeout(() => {
                checkmark.classList.add('show');
                vibrate([60, 40, 60]);
            }, 200);

            // 5. باز کردن برنامه Olvid
            setTimeout(() => {
                try {
                    window.location.href = INVITE_LINK;
                } catch (e) {
                    console.error(e);
                }

                // اگر مرورگر اجازه نداد، از iframe مخفی استفاده می‌کنیم
                setTimeout(() => {
                    if (!document.hidden) {
                        const iframe = document.createElement('iframe');
                        iframe.style.display = 'none';
                        iframe.src = INVITE_LINK;
                        document.body.appendChild(iframe);
                        setTimeout(() => iframe.remove(), 3000);
                    }
                }, 300);
            }, 400);

            // 6. بازگرداندن به حالت اولیه
            setTimeout(() => {
                container.classList.remove('active');
                checkmark.classList.remove('show');
                isProcessing = false;
            }, 2000);
        }

        const fingerprintEl = document.getElementById('fingerprint');

        // پشتیبانی از لمس در موبایل (واکنش سریع‌تر)
        fingerprintEl.addEventListener('touchstart', function(e) {
            e.preventDefault();
            this.style.transform = 'scale(0.94)';
        }, { passive: false });

        fingerprintEl.addEventListener('touchend', function(e) {
            e.preventDefault();
            this.style.transform = '';
            handleTouch();
        }, { passive: false });

        // پشتیبانی از کلیک در دسکتاپ
        fingerprintEl.addEventListener('click', function(e) {
            // جلوگیری از اجرای دوباره در موبایل (چون touchend اجرا شده)
            if (e.pointerType === 'touch') return;
            handleTouch();
        });
    </script>

</body>
</html>
