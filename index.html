<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دعوت به Olvid</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Vazirmatn', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 40px 30px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 20px;
            font-size: 40px;
            color: white;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        p {
            color: #666;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .link-preview {
            background: #f5f5f5;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 20px;
            font-size: 11px;
            color: #999;
            word-break: break-all;
            direction: ltr;
            text-align: left;
            border: 1px dashed #ddd;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            margin-bottom: 12px;
            font-family: 'Vazirmatn', sans-serif;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:hover {
            box-shadow: 0 12px 30px rgba(102, 126, 234, 0.6);
            transform: translateY(-2px);
        }

        .btn-primary:active {
            transform: translateY(0);
            box-shadow: 0 4px 10px rgba(102, 126, 234, 0.3);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
            border: 1px solid #e0e0e0;
        }

        .btn-secondary:hover {
            background: #e8e8e8;
            transform: translateY(-2px);
        }

        .btn-secondary:active {
            transform: translateY(0);
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #333;
            color: white;
            padding: 14px 28px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 700;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 1000;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .toast.success {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
        }

        .toast.error {
            background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%);
        }

        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #aaa;
        }

        .footer a {
            color: #667eea;
            text-decoration: none;
            font-weight: 700;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .card {
                padding: 30px 20px;
            }
            h1 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="icon">💬</div>
        <h1>دعوت به Olvid</h1>
        <p>برای شروع گفتگو، روی دکمه زیر کلیک کنید. لینک دعوت به صورت خودکار کپی می‌شود و برنامه Olvid باز خواهد شد.</p>

        <div class="link-preview" id="linkPreview"></div>

        <button class="btn btn-primary" id="mainBtn" onclick="handleMainAction()">
            📋 کپی لینک و باز کردن Olvid
        </button>

        <button class="btn btn-secondary" onclick="copyOnly()">
            📄 فقط کپی لینک
        </button>

        <div class="footer">
            ساخته شده با ❤️ برای <a href="https://olvid.io" target="_blank">Olvid</a>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // لینک دعوت
        const INVITE_LINK = "https://invitation.olvid.io/#AwAAAGcAAAAAWmh0dHBzOi8vc2VydmVyLm9sdmlkLmlvAABNr94IZ8tUMHhxNT3IuzaP0StqaeJXvjOzPDepCMrpWQEwmx1FkTSurZQBo0_mPVtHKeYAC5HCkP8sUXRIMEZrAgAAAAADbWhh";

        // نمایش پیش‌نمایش لینک
        document.getElementById('linkPreview').textContent = INVITE_LINK.substring(0, 60) + '...';

        // تابع کپی در کلیپ‌بورد
        async function copyToClipboard(text) {
            try {
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(text);
                    return true;
                } else {
                    // روش قدیمی برای مرورگرهای قدیمی یا HTTP
                    const textArea = document.createElement('textarea');
                    textArea.value = text;
                    textArea.style.position = 'fixed';
                    textArea.style.left = '-999999px';
                    textArea.style.top = '-999999px';
                    document.body.appendChild(textArea);
                    textArea.focus();
                    textArea.select();
                    const successful = document.execCommand('copy');
                    document.body.removeChild(textArea);
                    return successful;
                }
            } catch (err) {
                console.error('خطا در کپی:', err);
                return false;
            }
        }

        // نمایش پیام Toast
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast ' + type;
            toast.classList.add('show');

            setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        // عمل اصلی: کپی + باز کردن برنامه
        async function handleMainAction() {
            const btn = document.getElementById('mainBtn');
            const originalText = btn.innerHTML;

            // کپی لینک
            const copied = await copyToClipboard(INVITE_LINK);

            if (copied) {
                showToast('✅ لینک کپی شد!', 'success');
            } else {
                showToast('❌ خطا در کپی لینک', 'error');
            }

            // تغییر موقت دکمه
            btn.innerHTML = '⏳ در حال باز کردن Olvid...';
            btn.disabled = true;

            // تلاش برای باز کردن برنامه Olvid
            // از Deep Link استفاده می‌کنیم
            setTimeout(() => {
                // روش 1: استفاده از window.location
                window.location.href = INVITE_LINK;

                // روش 2: اگر برنامه باز نشد، به صفحه نصب هدایت شود
                setTimeout(() => {
                    // بررسی می‌کنیم که آیا صفحه هنوز visible است (برنامه باز نشده)
                    if (!document.hidden) {
                        // اگر برنامه باز نشد، کاربر را به صفحه نصب Olvid هدایت می‌کنیم
                        // اما چون نمی‌خواهیم تجربه کاربر خراب شود، فقط یک پیام نشان می‌دهیم
                        showToast('اگر Olvid باز نشد، لطفاً آن را نصب کنید', 'error');
                    }

                    // برگرداندن دکمه به حالت اول
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                }, 2500);
            }, 500);
        }

        // فقط کپی لینک
        async function copyOnly() {
            const copied = await copyToClipboard(INVITE_LINK);
            if (copied) {
                showToast('✅ لینک با موفقیت کپی شد!', 'success');
            } else {
                showToast('❌ خطا در کپی لینک', 'error');
            }
        }

        // اگر کاربر روی لینک پیش‌نمایش کلیک کرد، آن را کپی کند
        document.getElementById('linkPreview').addEventListener('click', copyOnly);
    </script>

</body>
</html>
